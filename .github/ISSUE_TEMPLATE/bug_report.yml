name: Bug report
description: Report a reproducible DataDoctor issue.
title: "bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: DataDoctor version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime versions
      description: Include OS, Node.js, and Python versions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic or sanitized files. Do not upload private data or credentials.
    validations:
      required: true
