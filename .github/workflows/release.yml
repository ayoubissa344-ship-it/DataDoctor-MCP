name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-and-package:
    name: Verify and package release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run full verification
        run: npm run test:all
      - name: Prepare source release archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="${RUNNER_TEMP}/datadoctor-mcp"
          mkdir -p "$STAGE"
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./release' -cf - . | tar -xf - -C "$STAGE"
          ARCHIVE="DataDoctor-MCP-${VERSION}.zip"
          (cd "${RUNNER_TEMP}" && zip -qr "${GITHUB_WORKSPACE}/${ARCHIVE}" datadoctor-mcp)
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            DataDoctor-MCP-*.zip
            DataDoctor-MCP-*.zip.sha256
