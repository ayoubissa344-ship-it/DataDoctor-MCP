name: Feature request
description: Propose a validator, diagnostic, or workflow improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and resource considerations
      description: Explain expected filesystem access, write behavior, size limits, and failure modes.
    validations:
      required: true
